name: ecommerce

services:
  hello-plugin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: hello
    ports:
      - "5433:5432"
    volumes:
      - hello-plugin-db-data:/var/lib/postgresql/data
    networks:
      - plugins
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello"]
      interval: 5s
      retries: 10

  hello-plugin-image:
    profiles:
      - plugin-images
    depends_on:
      hello-plugin-db:
        condition: service_healthy
    build:
      context: ./plugins/hello-plugin
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY HelloPlugin.csproj ./
        RUN dotnet restore
        COPY . .
        RUN dotnet publish -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "HelloPlugin.dll"]
    environment:
      ConnectionStrings__Default: "Host=hello-plugin-db;Port=5432;Database=hello;Username=hello;Password=hello"
    image: localhost:5000/ecommerce/hello-plugin:0.1.0

  products-plugin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
      POSTGRES_DB: products
    ports:
      - "5436:5432"
    volumes:
      - products-plugin-db-data:/var/lib/postgresql/data
    networks:
      - plugins
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products"]
      interval: 5s
      retries: 10

  products-plugin-image:
    profiles:
      - plugin-images
    depends_on:
      products-plugin-db:
        condition: service_healthy
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY Directory.Build.props ./
        COPY plugins/products-plugin/ProductsPlugin.csproj plugins/products-plugin/
        COPY src/ECommerce.IntegrationContracts/ECommerce.IntegrationContracts.csproj src/ECommerce.IntegrationContracts/
        RUN dotnet restore plugins/products-plugin/ProductsPlugin.csproj
        COPY plugins/products-plugin/ plugins/products-plugin/
        COPY src/ECommerce.IntegrationContracts/ src/ECommerce.IntegrationContracts/
        RUN dotnet publish plugins/products-plugin/ProductsPlugin.csproj -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "ProductsPlugin.dll"]
    environment:
      ConnectionStrings__Default: "Host=products-plugin-db;Port=5432;Database=products;Username=products;Password=products"
    image: localhost:5000/ecommerce/products-plugin:0.1.0

  cart-plugin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
      POSTGRES_DB: cart
    ports:
      - "5437:5432"
    volumes:
      - cart-plugin-db-data:/var/lib/postgresql/data
    networks:
      - plugins
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart"]
      interval: 5s
      retries: 10

  cart-plugin-image:
    profiles:
      - plugin-images
    depends_on:
      cart-plugin-db:
        condition: service_healthy
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY Directory.Build.props ./
        COPY plugins/cart-plugin/CartPlugin.csproj plugins/cart-plugin/
        COPY src/ECommerce.IntegrationContracts/ECommerce.IntegrationContracts.csproj src/ECommerce.IntegrationContracts/
        RUN dotnet restore plugins/cart-plugin/CartPlugin.csproj
        COPY plugins/cart-plugin/ plugins/cart-plugin/
        COPY src/ECommerce.IntegrationContracts/ src/ECommerce.IntegrationContracts/
        RUN dotnet publish plugins/cart-plugin/CartPlugin.csproj -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "CartPlugin.dll"]
    environment:
      ConnectionStrings__Default: "Host=cart-plugin-db;Port=5432;Database=cart;Username=cart;Password=cart"
    image: localhost:5000/ecommerce/cart-plugin:0.1.0

  payment-plugin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5434:5432"
    volumes:
      - payment-plugin-db-data:/var/lib/postgresql/data
    networks:
      - plugins
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      retries: 10

  payment-plugin-image:
    profiles:
      - plugin-images
    depends_on:
      payment-plugin-db:
        condition: service_healthy
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY Directory.Build.props ./
        COPY plugins/payment-plugin/PaymentPlugin.csproj plugins/payment-plugin/
        COPY src/ECommerce.IntegrationContracts/ECommerce.IntegrationContracts.csproj src/ECommerce.IntegrationContracts/
        RUN dotnet restore plugins/payment-plugin/PaymentPlugin.csproj
        COPY plugins/payment-plugin/ plugins/payment-plugin/
        COPY src/ECommerce.IntegrationContracts/ src/ECommerce.IntegrationContracts/
        RUN dotnet publish plugins/payment-plugin/PaymentPlugin.csproj -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "PaymentPlugin.dll"]
    environment:
      ConnectionStrings__Default: "Host=payment-plugin-db;Port=5432;Database=payment;Username=payment;Password=payment"
    image: localhost:5000/ecommerce/payment-plugin:0.1.0

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - core

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ecommerce
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - core
      - plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=ecommerce;Username=ecommerce;Password=ecommerce"
      PluginRuntime__DockerEndpoint: "unix:///var/run/docker.sock"
      PluginRuntime__Network: "ecommerce_plugins"
      PluginRuntime__BrokerHost: "rabbitmq"
      PluginRuntime__BrokerPort: "5672"
      PluginRuntime__BrokerUsername: "ecommerce"
      PluginRuntime__BrokerPassword: "ecommerce"
      PluginRuntime__BrokerVirtualHost: "/"
      PluginRuntime__StripeSecretKey: "${Stripe__SecretKey}"
      PluginRuntime__StripeWebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
      Cors__Origins__0: "http://localhost:4200"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - core
      - plugins

  files-plugin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: files
      POSTGRES_PASSWORD: files
      POSTGRES_DB: files
    ports:
      - "5435:5432"
    volumes:
      - files-plugin-db-data:/var/lib/postgresql/data
    networks:
      - plugins
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U files"]
      interval: 5s
      retries: 10

  files-plugin-image:
    profiles:
      - plugin-images
    depends_on:
      files-plugin-db:
        condition: service_healthy
    build:
      context: ./plugins/files-plugin
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY FilesPlugin.csproj ./
        RUN dotnet restore
        COPY . .
        RUN dotnet publish FilesPlugin.csproj -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "FilesPlugin.dll"]
    environment:
      ConnectionStrings__Default: "Host=files-plugin-db;Port=5432;Database=files;Username=files;Password=files"
    image: localhost:5000/ecommerce/files-plugin:0.1.0

networks:
  core:
    name: ecommerce_core
  plugins:
    name: ecommerce_plugins

volumes:
  db-data:
  hello-plugin-db-data:
  products-plugin-db-data:
  cart-plugin-db-data:
  payment-plugin-db-data:
  files-plugin-db-data:
  registry-data:
