name: ecommerce

services:
  hello-plugin-image:
    profiles:
      - plugin-images
    build:
      context: ./plugins/hello-plugin
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY HelloPlugin.csproj ./
        RUN dotnet restore
        COPY . .
        RUN dotnet publish -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "HelloPlugin.dll"]
    image: localhost:5000/ecommerce/hello-plugin:0.1.0

  products-plugin-image:
    profiles:
      - plugin-images
    build:
      context: ./plugins/products-plugin
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        COPY ProductsPlugin.csproj ./
        RUN dotnet restore
        COPY . .
        RUN dotnet publish -c Release -o /out

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /out ./
        EXPOSE 8080
        ENTRYPOINT ["dotnet", "ProductsPlugin.dll"]
    image: localhost:5000/ecommerce/products-plugin:0.1.0

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - core

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=ecommerce;Username=ecommerce;Password=ecommerce"
      PluginRuntime__DockerEndpoint: "unix:///var/run/docker.sock"
      PluginRuntime__Network: "ecommerce_plugins"
      Cors__Origins__0: "http://localhost:4200"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - core
      - plugins

networks:
  core:
    name: ecommerce_core
  plugins:
    name: ecommerce_plugins

volumes:
  db-data:
  registry-data:
